version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: recsys_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: recsys_db
    ports:
      - "5435:5432"  # <--- CHANGED THIS LINE
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: recsys_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
